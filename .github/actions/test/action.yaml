name: Test
description: "Run formatting, linting, and tests for Go projects"

inputs: {}

runs:
  using: "composite"
  steps:
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: "1.26"
    
    - name: Check format
      run: |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then
          echo "The following files are not formatted:"
          echo "$unformatted"
          exit 1
        fi
      shell: bash

    - name: Install Dependencies
      run: go mod download
      shell: bash

    - name: Verify dependencies
      run: go mod verify
      shell: bash

    - name: Build Project
      run: go build -v ./...
      shell: bash

    - name: Lint
      run: go vet ./...
      shell: bash

    - name: Run tests
      run: go test -v ./...
      shell: bash
